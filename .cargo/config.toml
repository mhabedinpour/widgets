[target.xtensa-esp32s3-none-elf]
runner = "scripts/flash.sh"

[env]
ESP_LOG="info"
LIBCLANG_PATH = { value = "/Library/Developer/CommandLineTools/usr/lib", force = true }
BINDGEN_EXTRA_CLANG_ARGS = {
  value = "-isystem /Users/mo/.rustup/toolchains/esp/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/xtensa-esp-elf/include -isystem /Users/mo/.rustup/toolchains/esp/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/lib/gcc/xtensa-esp-elf/15.2.0/include",
  force = true
}
CC_xtensa_esp32s3_none_elf = "xtensa-esp32s3-elf-gcc"
AR_xtensa_esp32s3_none_elf = "xtensa-esp32s3-elf-ar"
CFLAGS_xtensa_esp32s3_none_elf = "-mlongcalls"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
