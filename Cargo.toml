[package]
edition      = "2024"
name         = "widgets"
rust-version = "1.88"
version      = "0.1.0"
build        = "build/main.rs"

[[bin]]
name = "widgets"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.10.0", default-features = false, features = ["compat", "nightly"] }
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
critical-section = "1.2.0"
embedded-tls = { version = "0.19.0", default-features = false }
rand_core = { version = "0.6", default-features = false }
static_cell = { version = "2.1.1", features = ["nightly"] }
embedded-graphics = "0.8.2"
esp-hub75 = {git = "https://github.com/liebman/esp-hub75", branch = "main", features = ["esp32s3", "blank-delay-2"]}
embassy-sync = "0.8.0"
wasmi     = { version = "1.1.0", default-features = false }
u8g2-fonts = { version = "0.8", default-features = false }
picoserve = { version = "0.19", features = ["embassy", "json", "alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
esp-storage = {version =  "0.9", features = ["esp32s3"]}
littlefs2 = { version = "0.8", features = ["c-stubs", "log-error", "log-all"] }
embedded-storage = "0.3"
heapless = "0.9.3"

[build-dependencies]
syn = { version = "3.0.2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
littlefs2 = { version = "0.8", features = ["c-stubs"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
